services:
  - type: web
    name: manisoft-starshine
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt 2>/dev/null || true"
    startCommand: "python3 app.py"
    envVars:
      - key: PORT
        value: 10000
      - key: FLASK_ENV
        value: production
